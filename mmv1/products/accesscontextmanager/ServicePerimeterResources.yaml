---
name: 'ServicePerimeterResources'
api_resource_type_kind: ServicePerimeter
description: |
  Allows configuring GCP resources that should be inside the `status` block of a service perimeter.
  The resources are intended to be used in cases where it is not possible to compile a full list
  of resources to include in a `google_access_context_manager_service_perimeter` resource,
  to enable them to be added separately.

  ~> **Note:** If this resource is used alongside a `google_access_context_manager_service_perimeter` resource,
  the service perimeter resource must have a `lifecycle` block with `ignore_changes = [status[0].resources]` so
  they don't fight over which resources should be in the policy.
references:
  guides:
    'Service Perimeter Quickstart': 'https://cloud.google.com/vpc-service-controls/docs/quickstart'
  api: 'https://cloud.google.com/access-context-manager/docs/reference/rest/v1/accessPolicies.servicePerimeters'
docs:
  warning: |
    If you are using User ADCs (Application Default Credentials) with this resource,
    you must specify a `billing_project` and set `user_project_override` to true
    in the provider configuration. Otherwise the ACM API will return a 403 error.
    Your account must have the `serviceusage.services.use` permission on the
    `billing_project` you defined.
id_format: '{{perimeter_name}}'
base_url: ''
self_link: '{{perimeter_name}}'
create_url: '{{perimeter_name}}'
create_verb: 'PATCH'
update_mask: false
delete_verb: 'PATCH'
update_verb: 'PATCH'
# immutable: true
mutex: '{{perimeter_name}}'
import_format:
  - '{{perimeter_name}}'
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
autogen_async: true
async:
  actions: ['create', 'delete', 'update']
  type: 'OpAsync'
  operation:
    base_url: '{{op_id}}'
  result:
    resource_inside_response: true
identity:
  - resources
custom_code:
  constants: 'templates/terraform/constants/access_context_manager_service_perimeter_resources.go.tmpl'
  custom_import: 'templates/terraform/custom_import/access_context_manager_service_perimeter_resource.go.tmpl'
  decoder: 'templates/terraform/decoders/access_context_manager_service_perimeter_resources.go.tmpl'
  pre_create: 'templates/terraform/pre_create/access_context_manager_service_perimeter_resources.go.tmpl'
  pre_update: 'templates/terraform/pre_update/access_context_manager_service_perimeter_resources.go.tmpl'
  pre_delete: 'templates/terraform/pre_delete/access_context_manager_service_perimeter_resources.go.tmpl'
exclude_tgc: true
# Skipping the sweeper due to the non-standard base_url and because this is fine-grained under ServicePerimeter
exclude_sweeper: true
error_retry_predicates:

  - 'transport_tpg.AcmInvalidEtag'
examples:
  - name: 'access_context_manager_service_perimeter_resource_basic'
    primary_resource_id: 'service-perimeter-resource'
    vars:
      service_perimeter_name: 'restrict_all'
    exclude_test: true
parameters:
  - name: 'perimeterName'
    type: ResourceRef
    description: |
      The name of the Service Perimeter to add the resources to.
    url_param_only: true
    required: true
    immutable: true
    resource: 'ServicePerimeter'
    imports: 'name'
properties:
  - name: 'resources'
    type: Array
    description: |
      A list of resources protected by this `ServicePerimeter`
      that are allowed to be accessed by sources defined in the
      `IngressFrom` config.
    is_set: true
    item_type:
      type: String
    required: true